<svg xmlns="http://www.w3.org/2000/svg" width="800" height="60" viewBox="0 0 800 60">
  <style>
    text { font-family: 'Consolas', 'Courier New', monospace; font-size: 24px; font-weight: 700; letter-spacing: 2px; }
    .l { opacity: 0; animation: cycle 12s infinite; }
    .l2 { animation-delay: 4s; }
    .l3 { animation-delay: 8s; }
    .c { animation: blink 1s steps(1) infinite; }
    @keyframes cycle { 0% {opacity:0} 4% {opacity:1} 30% {opacity:1} 34% {opacity:0} 100% {opacity:0} }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g filter="url(#glow)" text-anchor="middle">
    <text class="l l1" x="400" y="38" fill="#2ee88a">&gt; AI ENGINEERING · RAG · MCP</text>
    <text class="l l2" x="400" y="38" fill="#ff3b30">&gt; PLATFORM MANAGER @ SURIDATA</text>
    <text class="l l3" x="400" y="38" fill="#2ee88a">&gt; DATA + AI FOR HEALTHTECH</text>
  </g>
</svg>
