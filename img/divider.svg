<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="30" viewBox="0 0 1200 30">
<style>.gl{animation:pulse 4s ease-in-out infinite} @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.dia{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite} @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff3b30" stop-opacity="0"/><stop offset=".2" stop-color="#ff3b30"/><stop offset=".5" stop-color="#3a3a3a"/><stop offset=".8" stop-color="#2ee88a"/><stop offset="1" stop-color="#2ee88a" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect class="gl" x="0" y="13" width="1200" height="4" rx="2" fill="url(#g)" filter="url(#glow)"/>
<polygon class="dia" points="590,15 600,7 610,15 600,23" fill="#1a1a1a" stroke="#2ee88a" stroke-width="2"/>
</svg>